<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Budget & Expense Tracker</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Firebase SDKs (Compat Version) -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
    </style>
</head>
<body class="h-full bg-slate-50 text-slate-800 flex flex-col justify-between">

    <!-- Top Status Bar -->
    <header class="bg-white border-b border-slate-200 sticky top-0 z-30">
        <div class="max-w-6xl mx-auto px-4 py-3 flex flex-wrap justify-between items-center gap-3">
            <div class="flex items-center space-x-3">
                <div class="bg-indigo-600 text-white p-2.5 rounded-xl shadow-sm">
                    <i class="fa-solid fa-wallet text-lg"></i>
                </div>
                <div>
                    <h1 class="font-bold text-lg text-slate-900 leading-tight">Budget & Expense Tracker</h1>
                    <p id="sync-status" class="text-xs text-amber-600 font-medium flex items-center gap-1.5 mt-0.5">
                        <span class="inline-block w-2 h-2 rounded-full bg-amber-500 animate-pulse"></span> Connecting to Cloud...
                    </p>
                </div>
            </div>
            
            <div class="flex items-center gap-2">
                <div class="flex items-center bg-slate-100 rounded-lg p-1 border border-slate-200 text-sm">
                    <span class="px-2 text-slate-500 text-xs font-semibold">Currency:</span>
                    <select id="currency-select" class="bg-white font-semibold text-slate-700 px-2 py-1 rounded shadow-sm focus:outline-none cursor-pointer">
                        <option value="R">ZAR (R)</option>
                        <option value="$">USD ($)</option>
                        <option value="€">EUR (€)</option>
                        <option value="£">GBP (£)</option>
                    </select>
                </div>
                <button type="button" onclick="seedSampleData()" class="bg-indigo-50 hover:bg-indigo-100 text-indigo-700 text-xs font-semibold px-3 py-2 rounded-lg transition border border-indigo-200 cursor-pointer">
                    <i class="fa-solid fa-wand-magic-sparkles mr-1"></i> Quick Test Data
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-6xl w-full mx-auto px-4 py-6 flex-grow grid grid-cols-1 lg:grid-cols-3 gap-6">
        
        <!-- Left 2 Columns: Budgets & Expenses -->
        <div class="lg:col-span-2 space-y-6">
            
            <!-- Summary Metric Cards -->
            <div class="grid grid-cols-3 gap-4">
                <div class="bg-white p-4 rounded-2xl border border-slate-200 shadow-xs">
                    <p class="text-xs font-medium text-slate-500">Total Budget</p>
                    <h2 id="total-budget" class="text-lg md:text-xl font-bold text-slate-900 mt-1">R 0.00</h2>
                </div>
                <div class="bg-white p-4 rounded-2xl border border-slate-200 shadow-xs">
                    <p class="text-xs font-medium text-slate-500">Total Spent</p>
                    <h2 id="total-spent" class="text-lg md:text-xl font-bold text-indigo-600 mt-1">R 0.00</h2>
                </div>
                <div class="bg-white p-4 rounded-2xl border border-slate-200 shadow-xs">
                    <p class="text-xs font-medium text-slate-500">Remaining</p>
                    <h2 id="total-remaining" class="text-lg md:text-xl font-bold text-emerald-600 mt-1">R 0.00</h2>
                </div>
            </div>

            <!-- Category Budgets Section -->
            <section class="bg-white rounded-2xl p-5 border border-slate-200 shadow-xs">
                <div class="flex justify-between items-center mb-4">
                    <h3 class="font-bold text-base text-slate-900 flex items-center gap-2">
                        <i class="fa-solid fa-layer-group text-indigo-600"></i> Budget Categories
                    </h3>
                    <button type="button" onclick="openCategoryModal()" class="bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-semibold px-3 py-2 rounded-xl transition shadow-xs flex items-center gap-1.5 cursor-pointer">
                        <i class="fa-solid fa-plus"></i> Add Category
                    </button>
                </div>
                
                <div id="category-list" class="space-y-4 max-h-[380px] overflow-y-auto pr-1">
                    <div class="text-center py-8 text-slate-400 text-sm">Loading categories...</div>
                </div>
            </section>

            <!-- Expense Logging Form -->
            <section class="bg-white rounded-2xl p-5 border border-slate-200 shadow-xs">
                <h3 class="font-bold text-base text-slate-900 mb-4 flex items-center gap-2">
                    <i class="fa-solid fa-receipt text-indigo-600"></i> Log New Expense
                </h3>
                <form id="expense-form" onsubmit="handleExpenseSubmit(event)" class="grid grid-cols-1 sm:grid-cols-3 gap-3">
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">Category</label>
                        <select id="expense-category" required class="w-full bg-slate-50 border border-slate-300 rounded-xl px-3 py-2 text-sm focus:bg-white focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                            <option value="">Select Category</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">Amount</label>
                        <input type="number" step="0.01" id="expense-amount" placeholder="0.00" required class="w-full bg-slate-50 border border-slate-300 rounded-xl px-3 py-2 text-sm focus:bg-white focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">Description / Note</label>
                        <div class="flex gap-2">
                            <input type="text" id="expense-note" placeholder="e.g. Woolworths groceries" required class="w-full bg-slate-50 border border-slate-300 rounded-xl px-3 py-2 text-sm focus:bg-white focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                            <button type="submit" class="bg-slate-900 hover:bg-slate-800 text-white px-4 py-2 rounded-xl text-sm font-semibold transition shrink-0 cursor-pointer">
                                <i class="fa-solid fa-check"></i>
                            </button>
                        </div>
                    </div>
                </form>
            </section>
        </div>

        <!-- Right Column: Charts & Recent Transactions -->
        <div class="space-y-6">
            <!-- Analytics Chart -->
            <section class="bg-white rounded-2xl p-5 border border-slate-200 shadow-xs flex flex-col items-center">
                <h3 class="font-bold text-base text-slate-900 w-full mb-2 flex items-center gap-2">
                    <i class="fa-solid fa-chart-pie text-indigo-600"></i> Spending Breakdown
                </h3>
                <div class="w-full h-56 relative flex items-center justify-center">
                    <canvas id="spendingChart"></canvas>
                </div>
            </section>

            <!-- Transaction History -->
            <section class="bg-white rounded-2xl p-5 border border-slate-200 shadow-xs">
                <div class="flex justify-between items-center mb-3">
                    <h3 class="font-bold text-base text-slate-900 flex items-center gap-2">
                        <i class="fa-solid fa-clock-rotate-left text-indigo-600"></i> Recent Expenses
                    </h3>
                    <span id="transaction-count" class="text-xs bg-slate-100 text-slate-600 px-2 py-0.5 rounded-full font-medium">0 items</span>
                </div>
                <div id="transaction-list" class="space-y-2.5 max-h-[300px] overflow-y-auto pr-1">
                    <div class="text-center py-6 text-slate-400 text-xs">No transactions recorded yet.</div>
                </div>
            </section>
        </div>

    </main>

    <!-- Modal: Add / Edit Category -->
    <div id="category-modal" style="display: none;" class="fixed inset-0 bg-slate-900/50 backdrop-blur-xs z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl max-w-sm w-full p-6 shadow-xl border border-slate-200">
            <h3 id="cat-modal-title" class="font-bold text-lg text-slate-900 mb-4">Create Budget Category</h3>
            <form onsubmit="handleCategorySubmit(event)" class="space-y-4">
                <input type="hidden" id="cat-edit-id">
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">Category Name</label>
                    <input type="text" id="cat-name" placeholder="e.g. Groceries, Fuel" required class="w-full bg-slate-50 border border-slate-300 rounded-xl px-3 py-2 text-sm focus:bg-white focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">Monthly Budget Allocation</label>
                    <input type="number" step="0.01" id="cat-budget" placeholder="0.00" required class="w-full bg-slate-50 border border-slate-300 rounded-xl px-3 py-2 text-sm focus:bg-white focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                </div>
                <div class="flex justify-end gap-2 pt-2">
                    <button type="button" onclick="closeCategoryModal()" class="px-4 py-2 text-sm font-semibold text-slate-600 hover:bg-slate-100 rounded-xl transition cursor-pointer">Cancel</button>
                    <button type="submit" class="px-4 py-2 text-sm font-semibold bg-indigo-600 text-white rounded-xl hover:bg-indigo-700 transition cursor-pointer">Save Category</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Application Script Logic -->
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAS0PNsVZkQ-NnA4tuRQgwFZNsS8NKf3q0",
            authDomain: "mybudgetapp-78139.firebaseapp.com",
            projectId: "mybudgetapp-78139",
            storageBucket: "mybudgetapp-78139.firebasestorage.app",
            messagingSenderId: "1079737396137",
            appId: "1:1079737396137:web:94073137ba0df430ae32b8"
        };

        let db = null;
        let auth = null;
        let userId = null;
        let isCloudSynced = false;

        let appData = {
            currency: 'R',
            categories: [],
            expenses: []
        };

        let spendingChartInstance = null;

        function initApp() {
            try {
                if (typeof firebase !== 'undefined' && firebaseConfig.apiKey) {
                    if (!firebase.apps.length) {
                        firebase.initializeApp(firebaseConfig);
                    }
                    auth = firebase.auth();
                    db = firebase.firestore();

                    // Safety timeout: If Firebase auth hangs for > 3 seconds, fall back to local mode gracefully
                    let authTimedOut = false;
                    const timeoutTimer = setTimeout(() => {
                        if (!isCloudSynced) {
                            authTimedOut = true;
                            console.warn("Firebase auth timed out, falling back to local mode.");
                            initLocalStorageMode();
                        }
                    }, 3500);

                    auth.signInAnonymously().then((userCredential) => {
                        if (authTimedOut) return;
                        clearTimeout(timeoutTimer);
                        userId = userCredential.user.uid;
                        isCloudSynced = true;
                        updateSyncBadge(true);
                        
                        db.collection('users').doc(userId).set({ lastLogin: new Date().toISOString() }, { merge: true })
                          .catch(err => console.log("User doc init note:", err));

                        setupCloudListeners();
                    }).catch((err) => {
                        if (authTimedOut) return;
                        clearTimeout(timeoutTimer);
                        console.warn("Firebase sign in failed:", err);
                        initLocalStorageMode();
                    });
                } else {
                    initLocalStorageMode();
                }
            } catch(e) {
                console.warn("Firebase init exception:", e);
                initLocalStorageMode();
            }
        }

        function initLocalStorageMode() {
            isCloudSynced = false;
            updateSyncBadge(false);
            try {
                const saved = localStorage.getItem('budget_app_data');
                if (saved) {
                    appData = JSON.parse(saved);
                }
            } catch(e) {}

            if (!appData.categories || appData.categories.length === 0) {
                appData.categories = [
                    { id: 'cat-1', name: 'Groceries', budget: 4500 },
                    { id: 'cat-2', name: 'Utilities', budget: 2000 }
                ];
                saveLocalData();
            }
            
            const curSelect = document.getElementById('currency-select');
            if (curSelect) curSelect.value = appData.currency || 'R';
            renderApp();
        }

        function saveLocalData() {
            try {
                localStorage.setItem('budget_app_data', JSON.stringify(appData));
            } catch(e) {}
        }

        function updateSyncBadge(synced) {
            const badge = document.getElementById('sync-status');
            if (!badge) return;
            if (synced) {
                badge.innerHTML = `<span class="inline-block w-2 h-2 rounded-full bg-emerald-500"></span> Cloud Synced (Firebase)`;
                badge.className = "text-xs text-emerald-600 font-medium flex items-center gap-1.5 mt-0.5";
            } else {
                badge.innerHTML = `<span class="inline-block w-2 h-2 rounded-full bg-indigo-500"></span> Local Storage Active`;
                badge.className = "text-xs text-indigo-600 font-medium flex items-center gap-1.5 mt-0.5";
            }
        }

        function setupCloudListeners() {
            if (!db || !userId) return;

            db.collection('users').doc(userId).get().then(doc => {
                if (doc.exists && doc.data().currency) {
                    appData.currency = doc.data().currency;
                    const curSelect = document.getElementById('currency-select');
                    if (curSelect) curSelect.value = appData.currency;
                }
            }).catch(err => {});

            db.collection('users').doc(userId).collection('categories').onSnapshot(snapshot => {
                appData.categories = [];
                snapshot.forEach(doc => appData.categories.push({ id: doc.id, ...doc.data() }));
                renderApp();
            }, err => console.error("Cloud cat error:", err));

            db.collection('users').doc(userId).collection('expenses').orderBy('date', 'desc').onSnapshot(snapshot => {
                appData.expenses = [];
                snapshot.forEach(doc => appData.expenses.push({ id: doc.id, ...doc.data() }));
                renderApp();
            }, err => console.error("Cloud exp error:", err));
        }

        document.addEventListener("DOMContentLoaded", () => {
            const curSelect = document.getElementById('currency-select');
            if (curSelect) {
                curSelect.addEventListener('change', (e) => {
                    appData.currency = e.target.value;
                    if (isCloudSynced && db && userId) {
                        db.collection('users').doc(userId).set({ currency: appData.currency }, { merge: true });
                    } else {
                        saveLocalData();
                    }
                    renderApp();
                });
            }
        });

        function openCategoryModal(catId = null) {
            const modal = document.getElementById('category-modal');
            if (!modal) return;

            if (catId) {
                const cat = appData.categories.find(c => c.id === catId);
                if (cat) {
                    document.getElementById('cat-modal-title').innerText = "Edit Category";
                    document.getElementById('cat-edit-id').value = cat.id;
                    document.getElementById('cat-name').value = cat.name;
                    document.getElementById('cat-budget').value = cat.budget;
                }
            } else {
                document.getElementById('cat-modal-title').innerText = "Create Budget Category";
                document.getElementById('cat-edit-id').value = "";
                document.getElementById('cat-name').value = "";
                document.getElementById('cat-budget').value = "";
            }
            modal.style.display = 'flex';
        }

        function closeCategoryModal() {
            const modal = document.getElementById('category-modal');
            if (modal) modal.style.display = 'none';
        }

        async function handleCategorySubmit(e) {
            e.preventDefault();
            const editId = document.getElementById('cat-edit-id').value;
            const name = document.getElementById('cat-name').value.trim();
            const budget = parseFloat(document.getElementById('cat-budget').value);

            if (!name || isNaN(budget)) return;

            if (editId) {
                if (isCloudSynced && db && userId) {
                    await db.collection('users').doc(userId).collection('categories').doc(editId).update({ name, budget });
                } else {
                    const index = appData.categories.findIndex(c => c.id === editId);
                    if (index !== -1) {
                        appData.categories[index] = { id: editId, name, budget };
                        saveLocalData();
                    }
                }
            } else {
                if (isCloudSynced && db && userId) {
                    await db.collection('users').doc(userId).collection('categories').add({ name, budget });
                } else {
                    appData.categories.push({ id: 'cat-' + Date.now(), name, budget });
                    saveLocalData();
                }
            }

            closeCategoryModal();
            renderApp();
        }

        async function deleteCategory(id) {
            if (!confirm("Are you sure you want to delete this category?")) return;

            if (isCloudSynced && db && userId) {
                await db.collection('users').doc(userId).collection('categories').doc(id).delete();
            } else {
                appData.categories = appData.categories.filter(c => c.id !== id);
                saveLocalData();
            }
            renderApp();
        }

        async function handleExpenseSubmit(e) {
            e.preventDefault();
            const categoryId = document.getElementById('expense-category').value;
            const amount = parseFloat(document.getElementById('expense-amount').value);
            const note = document.getElementById('expense-note').value.trim();

            if (!categoryId || isNaN(amount) || !note) return;

            const categoryObj = appData.categories.find(c => c.id === categoryId);
            const newExpense = {
                categoryId,
                categoryName: categoryObj ? categoryObj.name : 'General',
                amount,
                note,
                date: new Date().toISOString()
            };

            if (isCloudSynced && db && userId) {
                await db.collection('users').doc(userId).collection('expenses').add(newExpense);
            } else {
                newExpense.id = 'exp-' + Date.now();
                appData.expenses.unshift(newExpense);
                saveLocalData();
            }

            document.getElementById('expense-amount').value = '';
            document.getElementById('expense-note').value = '';
            renderApp();
        }

        async function deleteExpense(id) {
            if (isCloudSynced && db && userId) {
                await db.collection('users').doc(userId).collection('expenses').doc(id).delete();
            } else {
                appData.expenses = appData.expenses.filter(exp => exp.id !== id);
                saveLocalData();
            }
            renderApp();
        }

        function seedSampleData() {
            const sampleCats = [
                { name: 'Groceries', budget: 5000 },
                { name: 'Fuel & Transport', budget: 2500 },
                { name: 'Dining Out', budget: 1500 }
            ];
            const sampleExps = [
                { categoryName: 'Groceries', amount: 1250, note: 'Supermarket weekly run' },
                { categoryName: 'Fuel & Transport', amount: 850, note: 'Engen fill up' }
            ];

            if (isCloudSynced && db && userId) {
                sampleCats.forEach(async (cat) => {
                    await db.collection('users').doc(userId).collection('categories').add(cat);
                });
                setTimeout(async () => {
                    const snap = await db.collection('users').doc(userId).collection('categories').get();
                    let catMap = {};
                    snap.forEach(d => { catMap[d.data().name] = d.id; });

                    sampleExps.forEach(async (exp) => {
                        exp.categoryId = catMap[exp.categoryName] || '';
                        exp.date = new Date().toISOString();
                        await db.collection('users').doc(userId).collection('expenses').add(exp);
                    });
                }, 800);
            } else {
                appData.categories = sampleCats.map((c, i) => ({ id: 'cat-s' + i, ...c }));
                appData.expenses = sampleExps.map((e, i) => ({
                    id: 'exp-s' + i,
                    categoryId: appData.categories[i % appData.categories.length].id,
                    date: new Date().toISOString(),
                    ...e
                }));
                saveLocalData();
                renderApp();
            }
        }

        function renderApp() {
            const cur = appData.currency || 'R';
            const categories = appData.categories || [];
            const expenses = appData.expenses || [];

            const selectEl = document.getElementById('expense-category');
            if (selectEl) {
                const currentSelected = selectEl.value;
                selectEl.innerHTML = '<option value="">Select Category</option>' + 
                    categories.map(c => `<option value="${c.id}">${c.name} (Budget: ${cur} ${c.budget.toLocaleString()})</option>`).join('');
                selectEl.value = currentSelected;
            }

            let totalBudget = 0;
            let totalSpent = 0;
            const catSpentMap = {};

            expenses.forEach(exp => {
                catSpentMap[exp.categoryId] = (catSpentMap[exp.categoryId] || 0) + exp.amount;
                totalSpent += exp.amount;
            });

            const catListEl = document.getElementById('category-list');
            if (catListEl) {
                if (categories.length === 0) {
                    catListEl.innerHTML = `<div class="text-center py-8 text-slate-400 text-sm">No categories added yet. Click "Add Category" to begin.</div>`;
                } else {
                    catListEl.innerHTML = categories.map(cat => {
                        const spent = catSpentMap[cat.id] || 0;
                        const remaining = cat.budget - spent;
                        const pct = cat.budget > 0 ? Math.min(Math.round((spent / cat.budget) * 100), 100) : 0;
                        totalBudget += cat.budget;

                        let barColor = 'bg-emerald-500';
                        let badgeClass = 'bg-emerald-50 text-emerald-700 border-emerald-200';
                        if (pct >= 100) {
                            barColor = 'bg-rose-500';
                            badgeClass = 'bg-rose-50 text-rose-700 border-rose-200';
                        } else if (pct >= 75) {
                            barColor = 'bg-amber-500';
                            badgeClass = 'bg-amber-50 text-amber-700 border-amber-200';
                        }

                        return `
                            <div class="bg-slate-50 p-4 rounded-xl border border-slate-200">
                                <div class="flex justify-between items-center mb-2">
                                    <div class="flex items-center gap-2">
                                        <span class="font-bold text-sm text-slate-900">${cat.name}</span>
                                        <button type="button" onclick="openCategoryModal('${cat.id}')" class="text-slate-400 hover:text-indigo-600 transition p-1 cursor-pointer" title="Edit Budget">
                                            <i class="fa-solid fa-pen text-xs"></i>
                                        </button>
                                        <button type="button" onclick="deleteCategory('${cat.id}')" class="text-slate-400 hover:text-rose-600 transition p-1 cursor-pointer" title="Delete Category">
                                            <i class="fa-solid fa-trash-can text-xs"></i>
                                        </button>
                                    </div>
                                    <span class="text-xs font-semibold px-2 py-0.5 rounded-full border ${badgeClass}">
                                        ${cur} ${remaining.toLocaleString()} left
                                    </span>
                                </div>
                                <div class="flex justify-between text-xs text-slate-500 mb-1.5">
                                    <span>Spent: ${cur} ${spent.toLocaleString()}</span>
                                    <span>Budget: ${cur} ${cat.budget.toLocaleString()} (${pct}%)</span>
                                </div>
                                <div class="w-full bg-slate-200 rounded-full h-2 overflow-hidden">
                                    <div class="${barColor} h-2 rounded-full transition-all duration-500" style="width: ${pct}%"></div>
                                </div>
                            </div>
                        `;
                    }).join('');
                }
            }

            const totalRemaining = totalBudget - totalSpent;
            const tbEl = document.getElementById('total-budget');
            const tsEl = document.getElementById('total-spent');
            const remEl = document.getElementById('total-remaining');

            if (tbEl) tbEl.innerText = `${cur} ${totalBudget.toLocaleString()}`;
            if (tsEl) tsEl.innerText = `${cur} ${totalSpent.toLocaleString()}`;
            if (remEl) {
                remEl.innerText = `${cur} ${totalRemaining.toLocaleString()}`;
                remEl.className = `text-lg md:text-xl font-bold mt-1 ${totalRemaining < 0 ? 'text-rose-600' : 'text-emerald-600'}`;
            }

            const txListEl = document.getElementById('transaction-list');
            const txCountEl = document.getElementById('transaction-count');
            if (txCountEl) txCountEl.innerText = `${expenses.length} items`;

            if (txListEl) {
                if (expenses.length === 0) {
                    txListEl.innerHTML = `<div class="text-center py-6 text-slate-400 text-xs">No transactions recorded yet.</div>`;
                } else {
                    txListEl.innerHTML = expenses.map(exp => `
                        <div class="flex items-center justify-between p-3 bg-slate-50 rounded-xl border border-slate-200 text-sm">
                            <div>
                                <p class="font-semibold text-slate-900 leading-tight">${exp.note}</p>
                                <p class="text-xs text-slate-500 mt-0.5"><span class="font-medium text-indigo-600">${exp.categoryName || 'General'}</span> &bull; ${new Date(exp.date).toLocaleDateString()}</p>
                            </div>
                            <div class="flex items-center gap-3">
                                <span class="font-bold text-slate-900">-${cur} ${exp.amount.toLocaleString()}</span>
                                <button type="button" onclick="deleteExpense('${exp.id}')" class="text-slate-400 hover:text-rose-600 transition p-1 cursor-pointer" title="Delete Expense">
                                    <i class="fa-solid fa-trash-can text-xs"></i>
                                </button>
                            </div>
                        </div>
                    `).join('');
                }
            }

            renderChart(categories, catSpentMap, cur);
        }

        function renderChart(categories, catSpentMap, cur) {
            const canvasEl = document.getElementById('spendingChart');
            if (!canvasEl) return;
            const ctx = canvasEl.getContext('2d');
            const labels = categories.map(c => c.name);
            const data = categories.map(c => catSpentMap[c.id] || 0);

            if (spendingChartInstance) {
                spendingChartInstance.destroy();
            }

            const isEmpty = data.every(val => val === 0);
            const chartLabels = isEmpty ? ['No Spending Yet'] : labels;
            const chartData = isEmpty ? [1] : data;
            const chartColors = isEmpty ? ['#e2e8f0'] : ['#4f46e5', '#06b6d4', '#10b981', '#f59e0b', '#ef4444', '#8b5cf6', '#ec4899'];

            spendingChartInstance = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: chartLabels,
                    datasets: [{
                        data: chartData,
                        backgroundColor: chartColors,
                        borderWidth: 0
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            position: 'bottom',
                            labels: {
                                boxWidth: 12,
                                font: { size: 11, family: "'Plus Jakarta Sans', sans-serif" }
                            }
                        }
                    }
                }
            });
        }

        window.onload = initApp;
    </script>
</body>
</html>
